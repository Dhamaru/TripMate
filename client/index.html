    <title>TripMate</title>
    <!--
      DIRECTION: Passport & Visa Stamp System
      THESIS: TripMate is your passport, stamped at every stage of a trip — not a generic photo-card SaaS app.
      OWN-WORLD: Kraft/parchment-cream (light) / ink-navy under a customs-desk lamp (dark); four ink roles —
        customs-blue (planning), transit-green (active), exit-red (completed/alert), seal-black (official/system).
        IBM Plex Serif (headers), IBM Plex Mono (data: dates, prices, codes), IBM Plex Sans (body).
      STORY: Trip cards are passport bio-data pages; status badges are ink stamps; forms are customs declarations.
      FIRST VIEWPORT: Home dashboard as an open passport spread — traveler data left, current/next trip stamped
        in on the right with a date-stamp badge and real stamp texture, not a gradient hero card.
      FORM: Committed direction (rank 3 of 7 grounded candidates), full-palette ink-role strategy,
        Operate-mode discipline throughout.
    -->
