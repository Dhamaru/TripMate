name: Atlas Health Check

# Runs the golden-prompt eval against the live production deploy on a
# schedule, separate from the push-triggered build/test workflow — this
# needs code that's already deployed (not just checked out), and running it
# per-push would create throwaway signups on production every commit before
# Render even finishes deploying. A schedule instead catches provider
# outages / tool-routing regressions (like 2026-08-11's) automatically
# instead of waiting for a user to notice.

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch: {}     # allow manual trigger from the Actions tab

jobs:
  golden-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Atlas golden-prompt eval against production
        env:
          BASE_URL: https://tripmate-ylt6.onrender.com
        run: npx tsx scripts/atlas-golden-eval.ts
